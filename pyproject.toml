[project]
name = "ai-caos"
version = "0.1.0"
description = "AI driver-monitoring assistant (CodeLap Hackathon 2026, AI Drive)"
readme = "README.md"
requires-python = ">=3.11,<3.13"   # MediaPipe has no wheels for newer Python
dependencies = [
    "opencv-python",
    "mediapipe",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pyttsx3",
    "ollama",
    "python-dotenv",
]

[tool.uv]
package = false
